<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>יומן פיזיותרפיה</title>
<meta name="description" content="אפליקציה פשוטה וחינמית למעקב אחרי תרגילי פיזיותרפיה בתהליך שיקום">
<meta property="og:title" content="יומן פיזיותרפיה">
<meta property="og:description" content="אפליקציה פשוטה וחינמית למעקב אחרי תרגילי הפיזיותרפיה. צפו בסרטון קצר.">
<meta property="og:image" content="https://s-gazit.github.io/s-gazit-physio/share.jpg">
<meta property="og:url" content="https://s-gazit.github.io/s-gazit-physio/welcome.html">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f8f4e9">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{color-scheme:light;--ink:#2b2620;--ink2:#5f564a;--accent:#0f766e;--card:#fffdf7;--line:#ebe2d1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(#f8f4e9,#f0e5cf);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
/* phones are taller than the 9:16 video: fill the screen (trims a little off the sides, where nothing important is);
   wider screens show the whole video */
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:transparent}
@media (min-aspect-ratio: 9/16){ video{object-fit:contain} }

.bar{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(15,118,110,.15);z-index:2}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.skip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;z-index:3;border:0;border-radius:999px;padding:9px 16px;
  background:rgba(43,38,32,.55);color:#fff;font:inherit;font-size:15px;font-weight:600;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.play{position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;border:0;background:rgba(248,244,233,.35)}
.play.on{display:flex}
.play span{width:96px;height:96px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(15,118,110,.35)}
.play svg{width:40px;height:40px;margin-left:6px}

.end{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:rgba(43,38,32,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .35s}
.end.on{opacity:1;pointer-events:auto}
.card{width:100%;max-width:420px;background:var(--card);border-radius:28px;padding:28px 22px 20px;text-align:center;box-shadow:0 -10px 40px rgba(0,0,0,.18);
  transform:translateY(40px);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.end.on .card{transform:none}
.card img{width:84px;height:84px;border-radius:20px;box-shadow:0 10px 24px rgba(15,118,110,.28)}
.card h1{font-size:28px;margin:14px 0 4px}
.card p{margin:0 0 22px;color:var(--ink2);font-size:17px;line-height:1.45}
.go{display:block;text-decoration:none;background:var(--accent);color:#fff;font-weight:700;font-size:20px;padding:17px;border-radius:16px}
.again{display:block;width:100%;margin-top:8px;border:0;background:none;color:var(--ink2);font:inherit;font-size:16px;padding:12px}
</style>
</head>
<body>
<video id="v" src="promo.mp4" poster="poster.jpg" playsinline muted autoplay preload="auto"></video>
<div class="bar"><i id="prog"></i></div>
<button class="skip" id="skip">דילוג</button>
<button class="play" id="play" aria-label="הפעלת הסרטון"><span><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg></span></button>

<div class="end" id="end">
  <div class="card">
    <img src="icons/icon-180.png" alt="">
    <h1>יומן פיזיותרפיה</h1>
    <p>מעקב פשוט אחרי התרגילים<br>בתהליך השיקום</p>
    <a class="go" href="./">לאפליקציה</a>
    <button class="again" id="again">לצפייה חוזרת</button>
  </div>
</div>

<script>
(function(){
  const v = document.getElementById('v'), end = document.getElementById('end'), play = document.getElementById('play');
  const showEnd = () => { v.pause(); end.classList.add('on'); };
  function start(){
    play.classList.remove('on');
    v.play().catch(() => play.classList.add('on')); // e.g. iPhone in Low Power Mode blocks autoplay
  }
  v.addEventListener('ended', showEnd);
  // the video's last ~5s are a still closing frame: bring the card up ~1.5s into it instead of waiting for the end
  const CARD_BEFORE_END = 3.2;
  v.addEventListener('timeupdate', () => {
    if(!v.duration) return;
    document.getElementById('prog').style.width = (v.currentTime / v.duration * 100) + '%';
    if(v.currentTime >= v.duration - CARD_BEFORE_END && !end.classList.contains('on')) showEnd();
  });
  document.getElementById('skip').onclick = showEnd;
  play.onclick = start;
  document.getElementById('again').onclick = () => { end.classList.remove('on'); v.currentTime = 0; start(); };
  start();
})();
</script>
</body>
</html>
